[package]
name = "taguchi"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
statrs = "0.17"
include_dir = "0.7"
nalgebra = "0.33"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# tests/cli.rs reads the JSON the binary writes; integration tests cannot see
# the crate's own [dependencies].
serde_json = "1"

[[bench]]
name = "oa"
harness = false

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1
